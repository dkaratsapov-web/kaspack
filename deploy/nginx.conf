# /etc/nginx/sites-available/kaspack.ru
server {
  listen 443 ssl http2;
  server_name kaspack.ru www.kaspack.ru;
  # ssl_certificate ... (certbot)

  root /var/www/kaspack/out;
  index index.html;

  # старые адреса без .html: /strejch-plenka → strejch-plenka.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location ~* \.(webp|mp4|woff2|svg)$ { expires 30d; }

  location = /api/lead {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:3001;
  }

  error_page 404 /404.html;
}
